# The library's gates, run on every push and pull request.
#
# Each step is an existing script that the project also runs by hand; this file
# makes sure they run on every change. The order is the order of dependency:
# the token build writes the files the validators read.
#
# There are no browser checks here. The pages, the link check, scrolling,
# interactions and the visual baselines belong to crystal-preview, and run there
# against the published package.
name: Verify

on:
  push:
    branches: [main, 'crystal-*']
  pull_request:
  # Re-runnable without an empty commit. A workflow that only a push can trigger
  # cannot be used to check whether a secret was set correctly.
  workflow_dispatch:

# A superseded run has nothing to tell anyone.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: Tokens, contracts and documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund

      # Builds everything the library generates (tokens, catalogue, the
      # exported theme and the reference sections in core/docs/), then runs the
      # core contracts, the token validator (contrast included), the motion
      # validator, the documentation drift gate and the package boundary.
      #
      # These are the gates `publish.yml` runs before publishing, which is why
      # they stay in this repository. The website's own gates (the pages, the
      # links, scrolling, interactions and the visual baselines) live in
      # crystal-preview with the pages they are about.
      - run: npm test

      # If a build produces something different from what is committed, the
      # committed copy is stale and every downstream gate is reading a file
      # nobody has looked at.
      #
      # The pathspec stays repository-wide and anchored with `:(top)`. The
      # library and the website are folders at the repository root, so a bare
      # pathspec would resolve the same way today. It is anchored anyway: with
      # the anchoring left implicit, an exclude once resolved to
      # `design-system/design-system/…`, excluded nothing, and still passed
      # locally because there was no diff for it to exclude.
      #
      # Two files are the exception, and only for their dates.
      # `validation/token-checks.json` records in its `date` when the evidence
      # was produced, and `core/docs/accessibility.md`'s "Checks run" row quotes
      # that date, so both change with the calendar rather than with the source.
      # Compared exactly, they failed this job at midnight on 23 September 2026
      # on a commit that touched neither. Both are excluded from the exact
      # comparison, and the second command fails if anything in them but the
      # timestamp moved.
      - name: Generated files match their source
        run: |
          git diff --exit-code -- ':(top)' \
            ':(exclude,top)validation/token-checks.json' \
            ':(exclude,top)core/docs/accessibility.md' || {
            echo "::error::A build changed a committed file. Run the build and commit the result."
            exit 1
          }
          drift=$(git diff -U0 -- ':(top)validation/token-checks.json' \
            ':(top)core/docs/accessibility.md' \
            | grep -E '^[+-]' | grep -vE '^(\+\+\+|---)' \
            | grep -v '"date"' | grep -v 'Checks run' || true)
          if [ -n "$drift" ]; then
            echo "::error::The evidence changed beyond its timestamp:"
            echo "$drift"
            exit 1
          fi

